<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>লগইন — গ্রোসারি শপ</title>

    <meta name="description" content="গ্রোসারি শপ বিলিং সিস্টেমে লগইন করুন">


    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@100..900&display=swap"
        rel="stylesheet">


    <!-- CSS -->

    <link rel="stylesheet" href="../assets/css/style.css">

</head>


<body>


    <!-- ========================================
         Login Card
    ======================================== -->

    <div class="auth-wrapper">

        <div class="auth-card">


            <h1 class="auth-title">
                গ্রোসারি শপ
            </h1>


            <p class="auth-subtitle">
                আপনার অ্যাকাউন্টে লগইন করুন
            </p>


            <!-- Login Form -->

            <form id="loginForm">


                <!-- Email -->

                <div class="form-group">

                    <label class="form-label" for="email">

                        ইমেইল

                    </label>


                    <input type="email" id="email" class="form-input" placeholder="আপনার ইমেইল লিখুন" required>

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label class="form-label" for="password">

                        পাসওয়ার্ড

                    </label>


                    <input type="password" id="password" class="form-input" placeholder="আপনার পাসওয়ার্ড লিখুন"
                        required>

                </div>


                <!-- Forgot Password -->

                <div class="auth-link">

                    <a href="./forgot-password.html">

                        পাসওয়ার্ড ভুলে গেছেন?

                    </a>

                </div>


                <!-- Login Button -->

                <button type="submit" id="loginButton" class="btn btn-primary btn-block">

                    লগইন করুন

                </button>


            </form>


            <!-- Register -->

            <div class="auth-footer">

                অ্যাকাউন্ট নেই?

                <a href="./register.html">
                    রেজিস্টার করুন
                </a>

            </div>


        </div>

    </div>



    <!-- ========================================
         Firebase Libraries
    ======================================== -->

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>


    <!-- Firebase Configuration -->

    <script src="../assets/js/firebase.js"></script>



    <!-- ========================================
         Login System
    ======================================== -->

    <script>

        var loginForm = document.getElementById("loginForm");

        var loginButton = document.getElementById("loginButton");


        loginForm.addEventListener("submit", async function (e) {

            e.preventDefault();


            var email =
                document.getElementById("email").value.trim();

            var password =
                document.getElementById("password").value;


            if (email === "" || password === "") {

                alert("ইমেইল এবং পাসওয়ার্ড দিন।");

                return;

            }


            loginButton.disabled = true;

            loginButton.innerText = "লগইন হচ্ছে...";


            try {


                // Firebase Login

                await auth.signInWithEmailAndPassword(
                    email,
                    password
                );


                alert("লগইন সফল হয়েছে!");


                // Dashboard

                window.location.href =
                    "./dashboard.html";


            } catch (error) {


                console.error(error);


                if (error.code === "auth/invalid-credential") {

                    alert(
                        "ইমেইল অথবা পাসওয়ার্ড সঠিক নয়।"
                    );

                }

                else if (error.code === "auth/user-not-found") {

                    alert(
                        "এই ইমেইলে কোনো অ্যাকাউন্ট নেই।"
                    );

                }

                else if (error.code === "auth/wrong-password") {

                    alert(
                        "পাসওয়ার্ড সঠিক নয়।"
                    );

                }

                else if (error.code === "auth/invalid-email") {

                    alert(
                        "সঠিক ইমেইল দিন।"
                    );

                }

                else {

                    alert(
                        "লগইন করতে সমস্যা হয়েছে।\n" +
                        error.message
                    );

                }

            }


            loginButton.disabled = false;

            loginButton.innerText = "লগইন করুন";


        });

    </script>


</body>

</html>
