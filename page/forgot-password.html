<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পাসওয়ার্ড রিসেট — গ্রোসারি শপ</title>
    <meta name="description" content="আপনার পাসওয়ার্ড রিসেট করুন">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@100..900&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <div class="auth-wrapper">
        <div class="auth-card">

            <h1 class="auth-title">পাসওয়ার্ড রিসেট</h1>
            <p class="auth-subtitle">আপনার ইমেইল দিন, আমরা রিসেট লিংক পাঠাবো</p>

            <form id="forgotForm">

                <div class="form-group">
                    <label class="form-label" for="email">ইমেইল</label>
                    <input type="email" id="email" class="form-input" placeholder="আপনার ইমেইল লিখুন" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">রিসেট লিংক পাঠান</button>

            </form>

            <div class="auth-footer">
                <a href="./login.html">← লগইনে ফিরে যান</a>
            </div>

        </div>
    </div>

</body>

</html>
