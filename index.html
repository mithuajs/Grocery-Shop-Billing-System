<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বিলিং — গ্রোসারি শপ</title>
    <meta name="description" content="গ্রোসারি শপ বিলিং সিস্টেম — পণ্য সিলেক্ট করে বিল তৈরি করুন">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@100..900&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar no-print">
        <a href="./page/dashboard.html" class="navbar-brand">গ্রোসারি শপ</a>
        <ul class="navbar-links">
            <li><a href="./page/dashboard.html">ড্যাশবোর্ড</a></li>
            <li><a href="./index.html" class="active">বিলিং</a></li>
            <li><a href="./page/products.html">পণ্য</a></li>
            <li><a href="./page/sales.html">বিক্রয়</a></li>
            <li><a href="./page/login.html" class="btn btn-outline btn-sm">লগআউট</a></li>
        </ul>
    </nav>

    <!-- Print Header (shows only when printing) -->
    <div class="print-header">
        <h2>গ্রোসারি শপ</h2>
        <p>বিলের তারিখ: <span id="printDate"></span></p>
    </div>

    <div class="container">

        <!-- Product Catalog Section -->
        <div class="card product-grid-section">
            <h2 class="card-title">পণ্য বাছাই করুন</h2>

            <div class="product-grid" id="productCatalog">
                <!-- Products will be loaded by JS -->
            </div>
        </div>

        <!-- Custom Product Form -->
        <div class="card custom-form-section">
            <h2 class="card-title">কাস্টম পণ্য যোগ করুন</h2>

            <div class="form-row">

                <div class="form-group">
                    <label class="form-label" for="productName">পণ্যের নাম</label>
                    <input type="text" id="productName" class="form-input" placeholder="যেমন: বিস্কুট">
                </div>

                <div class="form-group">
                    <label class="form-label" for="price">দাম (৳)</label>
                    <input type="number" id="price" class="form-input" placeholder="০">
                </div>

                <div class="form-group">
                    <label class="form-label" for="quantity">পরিমাণ</label>
                    <input type="number" id="quantity" class="form-input" placeholder="১">
                </div>

                <div class="form-group">
                    <label class="form-label">&nbsp;</label>
                    <button id="addProductBtn" class="btn btn-primary btn-block">যোগ করুন</button>
                </div>

            </div>
        </div>

        <!-- Bill Table -->
        <div class="card">
            <h2 class="card-title">বিলের তালিকা</h2>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ক্রমিক</th>
                            <th>পণ্য</th>
                            <th>দাম</th>
                            <th>পরিমাণ</th>
                            <th>মোট</th>
                            <th class="no-print">অ্যাকশন</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody">
                    </tbody>
                </table>
            </div>

            <div id="emptyMessage" class="empty-state">
                এখনো কোনো পণ্য যোগ করা হয়নি। উপরে থেকে পণ্য সিলেক্ট করুন।
            </div>

            <!-- Bill Summary -->
            <div class="bill-summary">
                <div class="bill-total">
                    সর্বমোট: <span id="grandTotal">৳০</span>
                </div>
                <div class="bill-actions no-print">
                    <button id="printBtn" class="btn btn-outline">প্রিন্ট</button>
                    <button id="clearBtn" class="btn btn-danger">মুছে ফেলুন</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Quantity Modal -->
    <div class="modal-overlay" id="quantityModal">
        <div class="modal-box">
            <h3 id="modalProductName">পণ্যের পরিমাণ দিন</h3>
            <div class="form-group">
                <label class="form-label" for="modalQuantity">পরিমাণ</label>
                <input type="number" id="modalQuantity" class="form-input" value="1" min="1">
            </div>
            <div class="modal-actions">
                <button id="modalCancel" class="btn btn-outline">বাতিল</button>
                <button id="modalConfirm" class="btn btn-primary">যোগ করুন</button>
            </div>
        </div>
    </div>

    <script src="./assets/js/app.js"></script>
    <script src="./assets/js/javascript.js?v=2"></script>

</body>

</html>
