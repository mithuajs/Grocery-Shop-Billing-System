<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>পাসওয়ার্ড রিসেট — গ্রোসারি শপ</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/style.css">

</head>


<body>


    <div class="auth-wrapper">

        <div class="auth-card">

            <h1 class="auth-title">
                পাসওয়ার্ড রিসেট
            </h1>

            <p class="auth-subtitle">
                আপনার ইমেইল দিন, আমরা রিসেট লিংক পাঠাবো
            </p>


            <form id="forgotForm">


                <div class="form-group">

                    <label class="form-label" for="email">

                        ইমেইল

                    </label>


                    <input type="email" id="email" class="form-input" placeholder="আপনার ইমেইল লিখুন" required>

                </div>


                <button type="submit" id="resetBtn" class="btn btn-primary btn-block">

                    রিসেট লিংক পাঠান

                </button>


            </form>


            <div id="message" class="college-message">

            </div>


            <div class="auth-footer">

                <a href="./login.html">

                    ← লগইনে ফিরে যান

                </a>

            </div>

        </div>

    </div>


    <!-- Firebase -->

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>


    <!-- Firebase Config -->

    <script src="../assets/js/firebase.js"></script>


    <!-- Forgot Password -->

    <script src="../assets/js/forgot-password.js"></script>


</body>

</html>
