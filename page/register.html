<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>রেজিস্টার — গ্রোসারি শপ</title>
    <meta name="description" content="গ্রোসারি শপ বিলিং সিস্টেমে নতুন অ্যাকাউন্ট তৈরি করুন">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@100..900&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <div class="auth-wrapper">
        <div class="auth-card">

            <h1 class="auth-title">গ্রোসারি শপ</h1>
            <p class="auth-subtitle">নতুন অ্যাকাউন্ট তৈরি করুন</p>

            <form id="registerForm">

                <div class="form-group">
                    <label class="form-label" for="name">পুরো নাম</label>
                    <input type="text" id="name" class="form-input" placeholder="আপনার নাম লিখুন" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">ইমেইল</label>
                    <input type="email" id="email" class="form-input" placeholder="আপনার ইমেইল লিখুন" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">পাসওয়ার্ড</label>
                    <input type="password" id="password" class="form-input" placeholder="পাসওয়ার্ড তৈরি করুন" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">পাসওয়ার্ড নিশ্চিত করুন</label>
                    <input type="password" id="confirmPassword" class="form-input" placeholder="আবার পাসওয়ার্ড লিখুন" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">রেজিস্টার করুন</button>

            </form>

            <div class="auth-footer">
                ইতিমধ্যে অ্যাকাউন্ট আছে? <a href="./login.html">লগইন করুন</a>
            </div>

        </div>
    </div>

    <script src="../assets/js/register.js"></script>

</body>

</html>
