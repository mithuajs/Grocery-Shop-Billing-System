<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>পণ্য — গ্রোসারি শপ</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@100..900&display=swap" rel="stylesheet"><link rel="stylesheet" href="../assets/css/style.css"></head><body>

<main class="container"><div class="dashboard-header"><h1>পণ্য ও স্টক</h1><p>মোট <strong id="productCount">০</strong>টি পণ্য</p></div>
<section class="card"><h2 class="card-title" id="formTitle">নতুন পণ্য যোগ করুন</h2><form id="productForm" class="college-product-form"><input type="hidden" id="editId"><div class="form-group"><label class="form-label">পণ্যের নাম</label><input id="name" class="form-input" required></div><div class="form-group"><label class="form-label">দাম (৳)</label><input id="price" type="number" min="1" class="form-input" required></div><div class="form-group"><label class="form-label">ইউনিট</label><select id="unit" class="form-input"><option>পিস</option><option>কেজি</option><option>লিটার</option><option>প্যাকেট</option></select></div><div class="form-group"><label class="form-label">স্টক</label><input id="stock" type="number" min="0" class="form-input" required></div><div class="form-group"><label class="form-label">কম স্টক সীমা</label><input id="lowStockAt" type="number" min="0" value="10" class="form-input" required></div><button class="btn btn-primary" type="submit" id="saveBtn">সংরক্ষণ</button><button class="btn btn-outline hidden" type="button" id="cancelEdit">বাতিল</button></form></section>
<section class="card"><div class="college-section-head"><h2 class="card-title">পণ্যের তালিকা</h2><input id="search" class="form-input college-search" placeholder="পণ্য খুঁজুন..."></div><div class="table-wrapper"><table><thead><tr><th>#</th><th>পণ্য</th><th>দাম</th><th>ইউনিট</th><th>স্টক</th><th>অবস্থা</th><th>অ্যাকশন</th></tr></thead><tbody id="productRows"></tbody></table></div></section></main><div id="message" class="college-message"></div><script src="../assets/js/firebase-adapter.js?v=1"></script>
